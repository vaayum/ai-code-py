[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicoder"
version = "0.1.0"
description = "Autonomous AI coding agent — Python edition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "coding-agent", "llm", "cli", "langchain"]
dependencies = [
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # LLM orchestration
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.2.0",
    "mcp>=1.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    # Embeddings + vector store
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Code parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.0",
    # Git
    "gitpython>=3.1.40",
    # Config
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
aicoder = "aicoder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["aicoder"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
